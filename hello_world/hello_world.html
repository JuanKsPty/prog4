<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi pagina numero 1000</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef4ff 0%, #dfeaff 35%, #e8f6f1 100%);
            color: #1f2937;
        }
        body h1 {
            color: #1f2937;
        }
        body p {
            color: #4b5563;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .card {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        #initial-pokemons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        #initial-pokemons > div {
            display: flex;
        }
        #initial-pokemons label {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 180px;
            padding: 10px;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
        }
        input[type="radio"] {
            display: none;
        }

        .pokemon-radio:checked + label {
            border: 2px solid #092451;
            border-radius: 8px;
            margin: 0 10px;
            padding: 10px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    
    <main >
        <div class="card">
            <p> Bienvenido! <span id="user-name"> </span></p>
            <p> Hora actual: <span id="current-time"></span></p>
            <p> Escoge un pokemon:</p>
        </div>
        <div class="card">
            <p> Pokemon iniciales:</p>
            <div id="initial-pokemons" class="card"></div>
        </div>
        <div class="card table-container">
            <p> Lista de los primeros 20 pokemones:</p>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Imagen</th>
                </tr>
            </thead>
            <tbody id="pokemon-table-body">
           
            </tbody>
        </table>
        </div>
    </main>

    <script>
        const currentTimeElement = document.getElementById('current-time')
        const userNameElement = document.getElementById('user-name')
        const urlPokeApi = "https://pokeapi.co/api/v2/pokemon/"
        const initialPokemonsContainer = document.getElementById('initial-pokemons')
        const initialPokemons = [1, 4, 7] 
        const pokemonData = initialPokemons.map(id => fetch(urlPokeApi + id).then(response => response.json()))
        const first20PokemonsData = fetch(urlPokeApi + "?limit=20").then(response => response.json()).then(data => data.results)
        const pokemonTableBody = document.getElementById('pokemon-table-body')

        Promise.all(pokemonData)
            .then(pokemons => {
                pokemons.forEach(pokemon => {
                    const pokemonElement = document.createElement('div')
                    pokemonElement.innerHTML = `
                    <input type="radio" name="pokemon" value="${pokemon.name}" id="${pokemon.name}" class="pokemon-radio">
                        <label for="${pokemon.name}">
                        <h3>${pokemon.name}</h3>
                        <img src="${pokemon.sprites.front_default}" alt="${pokemon.name}">
                    </label>`
                    initialPokemonsContainer.appendChild(pokemonElement)
                })
            })
            .catch(error => console.error('Error fetching Pokémon data:', error))

        
        Promise.all([first20PokemonsData, ...pokemonData])
            .then(([first20Pokemons, ...pokemons]) => {
                first20Pokemons.forEach(pokemon => {
                    const row = document.createElement('tr')
                    row.innerHTML = `
                        <td>${pokemon.name}</td>
                        <td><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.url.split('/')[6]}.png" alt="${pokemon.name}"></td>
                    `
                    pokemonTableBody.appendChild(row)
                })
            })
            .catch(error => console.error('Error fetching Pokémon data:', error))    
        function updateCurrentTime() {
            const now = new Date()
            const timeString = now.toLocaleTimeString()
            currentTimeElement.textContent = timeString
        }

        updateCurrentTime()

        setInterval(updateCurrentTime, 1000)
    </script>
</body>
</html>
